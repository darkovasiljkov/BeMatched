@if (!memberService.editMode()) {
    @if (photos(); as photos) {
        @if (photos.length > 0) {
            <div class="grid grid-cols-4 auto-rows-auto-min gap-3 p-5 h=[65vh] overflow-auto">
                @for(photo of photos; track photo.id) {
                    <div class="relative overflow-hidden rounded-2xl border border-white/10 bg-black/40">
                        <img src="{{photo.url}}" alt="photo of member" class="h-56 w-full object-cover">

                        <button
                            type="button"
                            (click)="setMainPhoto(photo)"
                            [disabled]="isMainPhoto(photo)"
                            class="absolute right-2 top-2 z-10 inline-flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-black/60 text-white shadow-lg backdrop-blur-md transition-all duration-200 hover:scale-105 hover:bg-black/80"
                            [class.border-amber-300/60]="isMainPhoto(photo)"
                            [class.bg-amber-400/20]="isMainPhoto(photo)"
                            [class.text-amber-300]="isMainPhoto(photo)"
                            [class.opacity-80]="isMainPhoto(photo)"
                            [attr.aria-label]="isMainPhoto(photo) ? 'Main profile photo' : 'Set as main photo'"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5" [class.fill-current]="isMainPhoto(photo)" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                            </svg>
                        </button>

                        @if (isMainPhoto(photo)) {
                            <div class="absolute bottom-2 left-2 rounded-full border border-amber-300/40 bg-amber-400/15 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.24em] text-amber-300 backdrop-blur">
                                Main
                            </div>
                        }
                    </div>
                }
            </div>
        }@else {
            <p class="text-center text-gray-500">No photos available.</p>
        }
    }
} @else {
    <app-image-upload (uploadFile)="onUploadImage($event)" [loading]="loading()"></app-image-upload>
}
